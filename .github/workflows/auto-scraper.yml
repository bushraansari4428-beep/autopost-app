name: Auto Scraper Worker

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mappingId:
        description: 'Mapping ID for manual test'
        required: false
        type: string # Allow manual trigger from GitHub UI

concurrency:
  group: auto-scraper
  cancel-in-progress: false

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        working-directory: ./backend
        run: npx playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        
      - name: Install Playwright OS Dependencies (If Cached)
        working-directory: ./backend
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Prisma Generate
        working-directory: ./backend
        run: npx prisma generate

      - name: Install Python, yt-dlp & Impersonation Engine
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install --break-system-packages "yt-dlp[default,curl-cffi]"

      - name: Run Sync Script
        working-directory: ./backend
        run: npx ts-node scripts/run-sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          NODE_ENV: production
          TEST_MAPPING_ID: ${{ github.event.inputs.mappingId }}
