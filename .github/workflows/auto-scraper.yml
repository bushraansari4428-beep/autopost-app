name: Auto Scraper Worker

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      mappingId:
        description: 'Mapping ID for manual test'
        required: false
        type: string # Allow manual trigger from GitHub UI

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./backend
        run: npx playwright install chromium --with-deps

      - name: Run Prisma Generate
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Sync Script
        working-directory: ./backend
        run: npx ts-node scripts/run-sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          NODE_ENV: production
          TEST_MAPPING_ID: ${{ github.event.inputs.mappingId }}
